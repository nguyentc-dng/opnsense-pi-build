name: Build OPNsense image for RPI

on:
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    name: Build OPNsense image for RPI4 Model B
    runs-on: ["self-hosted", "freebsd", "arm64", "14.3"]
    timeout-minutes: 1440
    
    steps:
      - name: Checkout build source
        uses: actions/checkout@v4

      - name: Copy build tools to /usr
        run: |
          cd /usr/
          cp -r $GITHUB_WORKSPACE /usr/tools

      - name: Update build tools
        run: |
          cd /usr/tools/
          make update

      - name: Clean build directory before build
        run: rm -rf /usr/local/opnsense

      - name: Build base
        run: |
          cd /usr/tools/
          make base DEVICE=RPI4
          
      - name: Build kernel
        run: |
          cd /usr/tools/
          make kernel DEVICE=RPI4

      - name: Build packages
        run: |
          cd /usr/tools/
          make packages DEVICE=RPI4        

      - name: Build image
        run: |
          cd /usr/tools/
          make arm-4G DEVICE=RPI4
