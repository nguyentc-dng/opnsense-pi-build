name: Build OPNsense image for RPI

on:
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    name: Build OPNsense image for RPI4 Model B
    runs-on: ["self-hosted", "freebsd", "arm64", "14.3"]
    timeout-minutes: 1440
    
    steps:
      - name: Checkout build source
        uses: actions/checkout@v4

      - name: Copy build tools to /usr
        run: |
          cd /usr/
          rm -rf ./tools/
          cp -r $GITHUB_WORKSPACE /usr/tools

      - name: Update build tools
        run: |
          cd /usr/tools/
          make update

      - name: Clean build directory before build
        run: rm -rf /usr/local/opnsense

      - name: Build base
        run: |
          cd /usr/tools/
          make base DEVICE=RPI4
          
      - name: Build kernel
        run: |
          cd /usr/tools/
          make kernel DEVICE=RPI4

      - name: Install required pkg version
        run: make -C /usr/ports/ports-mgmt/pkg clean all reinstall

      - name: Build packages
        run: |
          cd /usr/tools/
          make packages DEVICE=RPI4        

      - name: Build image
        run: |
          cd /usr/tools/
          make arm-4G DEVICE=RPI4

      - name: Install zip if it's not installed
        run: pkg install -y zip
          
      - name: Compress image file
        id: compress_file
        run: |
          IMGFILE=$(find /usr/local/opnsense/ -type f -name *.img | head -n 1)
          IMGPATH=$(dirname $IMGFILE)
          BASENAME=$(basename "$IMGFILE" .img)
          zip $IMGFILE.zip $IMGFILE
          echo "file_path=$IMGFILE.zip" >> $GITHUB_OUTPUT
          echo "release_name=$BASENAME" >> $GITHUB_OUTPUT

      - name: Show release info
        run: |
          echo "File path: ${{ steps.compress_file.outputs.file_path }}"
          echo "Release name: ${{ steps.compress_file.outputs.release_name }}"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.compress_file.outputs.release_name }}
          release_name: ${{ steps.compress_file.outputs.release_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.compress_file.outputs.file_path }}
          asset_name: ${{ steps.compress_file.outputs.release_name }}.img.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
